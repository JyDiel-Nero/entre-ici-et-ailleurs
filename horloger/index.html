<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>L'Horloger — Atelier du temps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Merriweather:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#03050A; --panel:#06080F; --panel2:#0a0e18;
  --gold:#C9A96E; --gold-soft:rgba(201,169,110,.6); --gold-line:rgba(201,169,110,.15);
  --gold-line2:rgba(201,169,110,.28);
  --txt:#E8E4DC; --txt2:#bdb8ae; --txt3:#8a8f98; --txt4:#6b7078;
  --ok:#97C459; --ok-bg:rgba(151,196,89,.12);
  --warn:#EF9F27; --warn-bg:rgba(239,159,39,.12);
  --err:#E24B4A; --err-bg:rgba(226,75,74,.12);
  --ff-t:'Cormorant Garamond',Georgia,serif;
  --ff-b:'Merriweather',Georgia,serif;
}
[data-theme="light"]{
  --deep:#FBF8F2; --panel:#FFFFFF; --panel2:#F5F0E6;
  --gold:#9a7b3e; --gold-soft:rgba(154,123,62,.7); --gold-line:rgba(154,123,62,.18);
  --gold-line2:rgba(154,123,62,.32);
  --txt:#2a2418; --txt2:#4a4232; --txt3:#7a705c; --txt4:#9a9484;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--deep);color:var(--txt);font-family:var(--ff-b);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--gold);text-decoration:none}
button{font-family:var(--ff-b);cursor:pointer}
input,select,textarea{font-family:var(--ff-b)}

/* ── Login ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--deep)}
.login-box{max-width:420px;width:100%;text-align:center;padding:44px 34px;border:1px solid var(--gold-line2);background:var(--panel)}
.clock-mark{font-size:40px;color:var(--gold);margin-bottom:6px}
.login-title{font-family:var(--ff-t);font-size:34px;font-style:italic;color:var(--gold);letter-spacing:.08em;margin:0}
.login-sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--txt4);margin:6px 0 30px}
.login-text{font-family:var(--ff-t);font-size:17px;font-style:italic;color:var(--txt2);line-height:1.7;margin-bottom:30px}
.btn{background:rgba(201,169,110,.1);border:1px solid var(--gold-line2);color:var(--gold);font-size:13px;padding:12px 26px;letter-spacing:.06em;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--gold-soft);background:rgba(201,169,110,.16)}
.btn.solid{background:rgba(201,169,110,.14)}
.btn.ghost{background:transparent;border-color:var(--gold-line)}
.btn:disabled{opacity:.5;cursor:default}
.login-err{color:var(--err);font-size:13px;margin-top:18px;min-height:18px}

/* ── App shell ── */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.side{width:210px;flex:none;background:var(--panel);border-right:1px solid var(--gold-line);display:flex;flex-direction:column}
.side-head{text-align:center;padding:22px 16px 18px;border-bottom:1px solid var(--gold-line)}
.side-logo{font-size:26px;color:var(--gold)}
.side-name{font-family:var(--ff-t);font-size:20px;font-style:italic;color:var(--gold);letter-spacing:.1em;margin-top:4px}
.side-tag{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt4);margin-top:3px}
.nav{padding:12px 0;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--txt3);font-size:14px;border-left:2px solid transparent;transition:all .15s}
.nav a:hover{color:var(--gold);background:rgba(201,169,110,.04)}
.nav a.active{color:var(--gold);border-left-color:var(--gold);background:rgba(201,169,110,.06)}
.nav .ico{font-size:17px;width:18px;text-align:center}
.side-foot{padding:14px 18px;border-top:1px solid var(--gold-line);font-size:11px;color:var(--txt4)}
.side-foot .who{color:var(--txt3);margin:4px 0}
.theme-toggle{display:flex;align-items:center;gap:6px;margin-top:10px;background:transparent;border:1px solid var(--gold-line);color:var(--gold);font-size:11px;padding:6px 10px;width:100%;justify-content:center}

.main{flex:1;min-width:0;padding:26px 32px;max-width:1100px}
.view{display:none}
.view.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.vhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.vtitle{font-family:var(--ff-t);font-size:28px;color:var(--txt)}
.vactions{display:flex;gap:8px;flex-wrap:wrap}

/* ── Toast ── */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--panel);border:1px solid var(--gold-line2);color:var(--gold);font-family:var(--ff-t);font-size:15px;padding:13px 24px;z-index:1000;transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 40px rgba(0,0,0,.4);max-width:90%}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--err);color:var(--err)}
#toast.ok{border-color:var(--ok);color:var(--ok)}

/* ── Forms ── */
.fl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt4);margin:16px 0 6px}
.fl .hint{text-transform:none;letter-spacing:0;color:var(--txt4);font-size:11px}
.fi{width:100%;background:var(--panel2);border:1px solid var(--gold-line2);color:var(--txt);font-size:14px;padding:9px 12px;outline:none;transition:border-color .2s}
.fi:focus{border-color:var(--gold-soft)}
textarea.fi{resize:vertical;line-height:1.7;font-size:15px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow>div{flex:1;min-width:140px}

/* ── Editor ── */
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:820px){.edit-grid{grid-template-columns:1fr}.side{width:64px}.side-name,.side-tag,.nav a span,.side-foot .lbl{display:none}}
.preview{border:1px solid var(--gold-line);background:var(--panel2);padding:26px 24px;min-height:360px;position:relative}
.pv-tag{text-align:center;font-family:var(--ff-t);letter-spacing:.2em;font-size:10px;color:var(--gold);text-transform:uppercase}
.pv-title{text-align:center;font-family:var(--ff-t);font-size:27px;color:var(--txt);margin:6px 0 4px}
.pv-date{text-align:center;font-family:var(--ff-t);font-style:italic;font-size:12px;color:var(--txt3);margin-bottom:4px}
.pv-sep{width:40px;height:1px;background:var(--gold);margin:16px auto 22px}
.pv-body{font-family:var(--ff-t);font-size:17px;line-height:1.95;color:var(--txt2);text-align:center}
.pv-body p{margin:0 0 1.3em}
.pv-cover{width:100%;max-height:180px;object-fit:cover;margin-bottom:18px;border:1px solid var(--gold-line)}
.pv-watermark{position:absolute;top:10px;right:12px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt4)}

/* ── List / rows ── */
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--gold-line);font-size:14px;transition:background .15s}
.row.head{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt4);border-bottom-color:var(--gold-line2)}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:rgba(201,169,110,.05)}
.tag{font-size:10px;letter-spacing:.08em;padding:2px 9px;white-space:nowrap}
.tag.pub{color:var(--ok);background:var(--ok-bg)}
.tag.prog{color:var(--warn);background:var(--warn-bg)}
.tag.draft{color:var(--txt3);background:rgba(138,143,152,.12)}

/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
@media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:rgba(201,169,110,.05);border:1px solid var(--gold-line);padding:16px 14px;text-align:center}
.stat .sv{font-family:var(--ff-t);font-size:30px;color:var(--gold);line-height:1}
.stat .sl{font-size:11px;color:var(--txt3);margin-top:6px}
.panel{background:var(--panel2);border:1px solid var(--gold-line);padding:18px;margin-bottom:16px}
.ph{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt4);margin-bottom:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-size:13px;color:var(--txt2)}
.bar span{flex:0 0 90px}.bar b{color:var(--gold);font-weight:normal}
.track{flex:1;height:5px;background:rgba(201,169,110,.1);overflow:hidden}
.trackfill{height:100%;background:var(--gold);opacity:.7}

/* ── Timeline ── */
.tl{position:relative;padding-left:28px}
.tl-line{position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--gold-line2)}
.tl-item{position:relative;margin-bottom:22px}
.tl-item::before{content:'';position:absolute;left:-25px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--deep);border:2px solid var(--gold)}
.tl-when{font-size:11px;color:var(--gold);letter-spacing:.06em;margin-bottom:4px}
.tl-what b{font-family:var(--ff-t);font-size:18px;color:var(--txt);font-weight:normal}

/* ── Media ── */
.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.media-grid{grid-template-columns:repeat(2,1fr)}}
.thumb{aspect-ratio:1;min-height:120px;background:var(--panel2);border:1px solid var(--gold-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--txt4);font-size:10px;text-align:center;overflow:hidden;position:relative;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:block}
.thumb .cap{position:absolute;bottom:0;left:0;right:0;background:rgba(3,5,10,.82);color:var(--txt2);padding:5px 4px;font-size:9px;word-break:break-all;line-height:1.3;z-index:1}
.thumb.placeholder-ico{font-size:26px;color:var(--gold-soft)}
.media-search{width:100%;background:var(--panel2);border:1px solid var(--gold-line2);color:var(--txt);font-size:13px;padding:9px 12px;outline:none;margin-bottom:14px}
.media-search:focus{border-color:var(--gold-soft)}
.media-count{font-size:12px;color:var(--txt4);margin-left:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--gold-line);margin-bottom:8px;background:var(--panel2);transition:background .15s}
.lrow:hover{background:rgba(201,169,110,.04)}
.drag-handle{cursor:grab;color:var(--txt4);font-size:14px;letter-spacing:-3px;flex:none;user-select:none}
.drag-handle:active{cursor:grabbing}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--gold-line2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px;color:var(--txt3);font-family:var(--ff-t);font-style:italic;font-size:18px}
.center-load{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--txt3);gap:10px;font-family:var(--ff-t);font-style:italic}
</style>
</head>
<body>

<div id="login">
  <div class="login-box">
    <div class="clock-mark">&#9719;</div>
    <p class="login-title">L'Horloger</p>
    <p class="login-sub">Atelier du temps</p>
    <p class="login-text">Ici se règlent les aiguilles.<br>Identifiez-vous pour entrer dans l'atelier.</p>
    <button class="btn solid" id="loginBtn">S'identifier avec GitHub</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <aside class="side">
      <div class="side-head">
        <div class="side-logo">&#9719;</div>
        <div class="side-name">L'Horloger</div>
        <div class="side-tag">Atelier du temps</div>
      </div>
      <nav class="nav" id="nav">
        <a data-view="edit" class="active"><span class="ico">&#9998;</span><span>Écrire</span></a>
        <a data-view="list"><span class="ico">&#9776;</span><span>Tous les textes</span></a>
        <a data-view="plan"><span class="ico">&#9200;</span><span>Planning</span></a>
        <a data-view="minutes"><span class="ico">&#9834;</span><span>Minutes (audio)</span></a>
        <a data-view="secondes"><span class="ico">&#9635;</span><span>Secondes (galerie)</span></a>
        <a data-view="dash"><span class="ico">&#9632;</span><span>Cadran</span></a>
        <a data-view="media"><span class="ico">&#9640;</span><span>Médiathèque</span></a>
      </nav>
      <div class="side-foot">
        <div class="lbl" style="font-size:9px;letter-spacing:.1em;color:var(--txt4)">CONNECTÉ</div>
        <div class="who" id="whoami">…</div>
        <button class="theme-toggle" id="themeToggle"><span id="themeIcon">&#9788;</span> <span class="lbl">Thème</span></button>
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>
</div>

<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   L'HORLOGER — moteur
   ══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var TOKEN_KEY = 'horloger-token';
var THEME_KEY = 'horloger-theme';
var TAGS = ['POÉSIE','MÉDITATION','PRIÈRE','RÉFLEXION','RÉCIT'];

var state = {
  token: null,
  login: null,
  posts: [],
  sha: null,       /* sha courant de posts.json (pour écriture sûre) */
  editing: null,   /* slug en cours d'édition, ou null pour un nouveau */
  dirty: false
};

/* ── Utilitaires ── */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, html){
  var e = document.createElement(tag);
  if(attrs) for(var k in attrs){ if(k==='class') e.className=attrs[k]; else e.setAttribute(k, attrs[k]); }
  if(html!=null) e.innerHTML = html;
  return e;
}
function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':s); return d.innerHTML; }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

function toast(msg, kind, ms){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = kind ? kind : '';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.classList.remove('show'); }, ms||2600);
}

/* ── Appel à /api/cms ── */
function api(body){
  return fetch('/api/cms', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + state.token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  }).then(function(r){
    return r.json().then(function(data){
      if(!r.ok){ var e = new Error(data.error || ('HTTP '+r.status)); e.status = r.status; throw e; }
      return data;
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   AUTHENTIFICATION — réutilise le popup /api/auth (handshake Decap)
   ══════════════════════════════════════════════════════════════ */
function startLogin(){
  var errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Connexion…';

  var popup = window.open('/api/auth', 'horloger-auth', 'width=680,height=760');
  if(!popup){ errEl.textContent = 'Autorisez les fenêtres pop-up puis réessayez.'; resetLoginBtn(); return; }

  function onMsg(e){
    var d = e.data;
    if(typeof d !== 'string') return;
    /* handshake : le popup annonce 'authorizing:github' → on répond */
    if(d === 'authorizing:github'){
      popup.postMessage('authorizing:github', e.origin || '*');
      return;
    }
    /* succès : 'authorization:github:success:{json}' */
    if(d.indexOf('authorization:github:success:') === 0){
      window.removeEventListener('message', onMsg);
      var jsonStr = d.substring('authorization:github:success:'.length);
      var token = null;
      try { token = JSON.parse(jsonStr).token; } catch(err){}
      if(token){ afterToken(token); }
      else { errEl.textContent = 'Jeton non reçu. Réessayez.'; resetLoginBtn(); }
    }
  }
  window.addEventListener('message', onMsg);
}

function resetLoginBtn(){
  var btn = document.getElementById('loginBtn');
  btn.disabled = false;
  btn.textContent = "S'identifier avec GitHub";
}

function afterToken(token){
  state.token = token;
  /* Vérifier l'identité côté serveur avant d'ouvrir l'atelier */
  api({action:'whoami'}).then(function(res){
    state.login = res.login;
    try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
    openApp();
  }).catch(function(err){
    document.getElementById('loginErr').textContent = err.status===403
      ? 'Ce compte n\u2019est pas autorisé à publier.'
      : ('Connexion refusée : ' + err.message);
    state.token = null;
    resetLoginBtn();
  });
}

/* Reconnexion silencieuse si un jeton est déjà mémorisé */
function trySilentLogin(){
  var saved = null;
  try{ saved = localStorage.getItem(TOKEN_KEY); }catch(e){}
  if(!saved) return;
  state.token = saved;
  api({action:'whoami'}).then(function(res){
    state.login = res.login;
    openApp();
  }).catch(function(){
    /* jeton périmé → on reste sur l'écran de login */
    state.token = null;
    try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  });
}

function logout(){
  state.token = null; state.login = null;
  try{ localStorage.removeItem(TOKEN_KEY); }catch(e){}
  document.getElementById('app').style.display = 'none';
  document.getElementById('login').style.display = 'flex';
  resetLoginBtn();
}

/* ══════════════════════════════════════════════════════════════
   CHARGEMENT DES DONNÉES
   ══════════════════════════════════════════════════════════════ */
function loadPosts(){
  return api({action:'read', file:'data/posts.json'}).then(function(res){
    var doc = JSON.parse(res.content || '{"posts":[]}');
    state.posts = doc.posts || [];
    state.sha = res.sha;
    return state.posts;
  });
}

/* ── Aides sur les dates de programmation ── */
function isLive(p){
  if(p.published === false) return false;
  if(p.publishDate){
    var t = Date.parse(p.publishDate);
    if(!isNaN(t) && t > Date.now()) return false;
  }
  return true;
}
function postStatus(p){
  if(p.published === false) return {cls:'draft', label:'Brouillon'};
  if(p.publishDate){
    var t = Date.parse(p.publishDate);
    if(!isNaN(t) && t > Date.now()) return {cls:'prog', label:'Programmé'};
  }
  return {cls:'pub', label:'Publié'};
}
function fmtWhen(iso){
  var d = new Date(iso);
  if(isNaN(d)) return iso || '';
  var mois = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
  var h = ('0'+d.getHours()).slice(-2), m = ('0'+d.getMinutes()).slice(-2);
  return d.getDate()+' '+mois[d.getMonth()]+' '+d.getFullYear()+' · '+h+'h'+m;
}
function relTime(iso){
  var t = Date.parse(iso); if(isNaN(t)) return '';
  var diff = t - Date.now();
  var days = Math.round(diff/86400000);
  if(days > 1) return 'dans '+days+' jours';
  if(days === 1) return 'demain';
  if(days === 0){ var h = Math.round(diff/3600000); return h>0 ? ('dans '+h+' h') : 'aujourd\u2019hui'; }
  return 'passé';
}

/* ══════════════════════════════════════════════════════════════
   RENDU DES STROPHES (aperçu — identique à l'esprit du site)
   ══════════════════════════════════════════════════════════════ */
function stanzasToHtml(body){
  if(!body) return '<span style="color:var(--txt4)">L\u2019aperçu apparaîtra ici au fil de votre écriture…</span>';
  return body.replace(/\r\n/g,'\n').split(/\n\n+/).map(function(stanza){
    if(/^---$/.test(stanza.trim())) return '<div class="pv-sep"></div>';
    var isQuote = /^>\s?/.test(stanza);
    var lines = stanza.split('\n').map(function(l){
      /* Image markdown ![alt](url) sur sa ligne → figure */
      var im = l.match(/^\s*!\[([^\]]*)\]\(([^)]+)\)\s*$/);
      if(im){
        var alt = esc(im[1]);
        var url = im[2].trim();
        if(!/^https?:\/\//.test(url) && url.charAt(0)!=='/') url = '/'+url;
        return '<figure style="margin:1em 0"><img src="'+escAttr(url)+'" alt="'+alt+'" style="max-width:100%;max-height:200px;border:1px solid var(--gold-line)" onerror="this.style.display=\'none\'">'+(im[1]?'<figcaption style="font-size:12px;color:var(--txt3);font-style:italic;margin-top:5px">'+alt+'</figcaption>':'')+'</figure>';
      }
      return esc(l)
        .replace(/\*\*(.+?)\*\*/g,'<b style="color:var(--gold);font-weight:normal">$1</b>')
        .replace(/(^|[^*])\*(?!\*)(.+?)\*(?!\*)/g,'$1<em>$2</em>');
    }).join('<br>');
    /* nettoie les <br> superflus autour des figures */
    lines = lines.replace(/<br>(<figure)/g,'$1').replace(/(<\/figure>)<br>/g,'$1');
    if(isQuote) return '<blockquote style="border-left:2px solid var(--gold);padding-left:14px;font-style:italic;margin:1.2em 0">'+lines.replace(/&gt;\s?/,'')+'</blockquote>';
    return '<p>'+lines+'</p>';
  }).join('');
}

/* Slugify pour proposer un slug à partir du titre */
function slugify(s){
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60);
}

/* hoist pour isoToLocalInput utilisé dans le template avant sa définition */
function isoToLocalInput(iso){
  if(!iso) return '';
  var d = new Date(iso); if(isNaN(d)) return '';
  var p = function(n){return ('0'+n).slice(-2);};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
}

function localInputToIso(v){
  if(!v) return '';
  var d = new Date(v);
  if(isNaN(d)) return '';
  /* format avec offset local, comme les données existantes */
  var p=function(n){return ('0'+n).slice(-2);};
  var off = -d.getTimezoneOffset();
  var sign = off>=0?'+':'-'; off=Math.abs(off);
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':00.000'+sign+p(Math.floor(off/60))+':'+p(off%60);
}

function savePost(isEdit){
  var slug = $('#fSlug').value.trim();
  var title = $('#fTitle').value.trim();
  if(!title){ toast('Le titre est requis.', 'err'); return; }
  if(!slug){ toast('Le slug est requis.', 'err'); return; }
  if(!isEdit){
    /* refuser un slug déjà pris */
    for(var i=0;i<state.posts.length;i++){ if(state.posts[i].slug===slug){ toast('Ce slug existe déjà.', 'err'); return; } }
  }

  var post = {
    slug: slug,
    title: title,
    tag: $('#fTag').value,
    date: $('#fDate').value.trim(),
    author: $('#fAuthor').value.trim() || 'J.Y.D.',
    excerpt: $('#fExcerpt').value,
    body: $('#fBody').value,
    published: $('#fPublished').checked
  };
  var cover = $('#fCover').value.trim();
  if(cover) post.cover = cover;
  var sched = $('#fSchedule').value;
  if(sched){ post.publishDate = localInputToIso(sched); }

  var btn = $('#btnSave');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Enregistrement…';

  api({action:'upsertPost', post: post}).then(function(res){
    state.dirty = false;
    toast(res.added ? 'Texte publié ✓' : 'Modifications enregistrées ✓', 'ok', 3000);
    return loadPosts();
  }).then(function(){
    go('list');
  }).catch(function(err){
    btn.disabled = false; btn.textContent = isEdit?'Enregistrer les modifications':'Publier';
    if(err.status === 409){ toast('Conflit : rechargez, un changement externe a eu lieu.', 'err', 4000); }
    else toast('Échec : ' + err.message, 'err', 4000);
  });
}

function viewDash(){

  var bars = Object.keys(byTag).sort(function(a,b){return byTag[b]-byTag[a];}).map(function(t){

  main.innerHTML =
   '<div class="vhead"><div class="vtitle">Le Cadran</div><div style="font-size:12px;color:var(--txt3)">'+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</div></div>'

   +   '<div class="stat"><div class="sv">'+prog+'</div><div class="sl">Programmés</div></div>'
   +   '<div class="stat"><div class="sv">'+draft+'</div><div class="sl">Brouillons</div></div>'
   +   '<div class="stat"><div class="sv">'+total+'</div><div class="sl">Total</div></div>'
   + '</div>'
   + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="dash-cols">'
   +   '<div class="panel"><div class="ph">Par catégorie</div>'+bars+'</div>'

/* Cache de la liste d'images (évite de recharger 300 images à chaque fois) */
var mediaCache = null;

function loadImages(force){
  if(mediaCache && !force) return Promise.resolve(mediaCache);
  return api({action:'listImages'}).then(function(res){
    mediaCache = res.images || [];
    return mediaCache;
  });
}

/* Ouvre le sélecteur de fichier et téléverse ; renvoie le chemin */
function pickAndUpload(onDone){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.addEventListener('change', function(){
    var file = input.files && input.files[0];
    if(!file) return;
    if(file.size > 8*1024*1024){ toast('Image trop lourde (max 8 Mo).', 'err', 3500); return; }
    toast('Téléversement de « ' + file.name + ' »…', null, 8000);
    var reader = new FileReader();
    reader.onload = function(){
      var b64 = String(reader.result).replace(/^data:[^,]*,/, '');
      api({action:'uploadImage', name:file.name, contentBase64:b64}).then(function(res){
        mediaCache = null; /* invalider le cache */
        toast('Image ajoutée ✓', 'ok', 2500);
        if(onDone) onDone(res.path, res.name);
      }).catch(function(err){
        toast('Échec du téléversement : ' + err.message, 'err', 4000);
      });
    };
    reader.onerror = function(){ toast('Lecture du fichier impossible.', 'err'); };
    reader.readAsDataURL(file);
  });
  input.click();
}

/* Téléversement d'un fichier audio (mp3/m4a/ogg/wav) vers images/uploads */
function pickAndUploadAudio(onDone){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'audio/*,.mp3,.m4a,.ogg,.wav';
  input.addEventListener('change', function(){
    var file = input.files && input.files[0];
    if(!file) return;
    if(file.size > 25*1024*1024){ toast('Audio trop lourd (max 25 Mo).', 'err', 3500); return; }
    toast('Téléversement de « ' + file.name + ' »…', null, 12000);
    var reader = new FileReader();
    reader.onload = function(){
      var b64 = String(reader.result).replace(/^data:[^,]*,/, '');
      api({action:'uploadMedia', name:file.name, contentBase64:b64}).then(function(res){
        toast('Audio ajouté ✓', 'ok', 2500);
        if(onDone) onDone(res.path, res.name);
      }).catch(function(err){
        toast('Échec du téléversement : ' + err.message, 'err', 4000);
      });
    };
    reader.onerror = function(){ toast('Lecture du fichier impossible.', 'err'); };
    reader.readAsDataURL(file);
  });
  input.click();
}

/* Filtre la grille déjà affichée (sans recharger) */
function filterMediaGrid(query){
  var grid = document.getElementById('mediaGrid');
  if(!grid) return;
  var q = (query||'').toLowerCase().trim();
  var shown = 0;
  Array.prototype.forEach.call(grid.querySelectorAll('.thumb'), function(t){
    var name = (t.getAttribute('data-name')||'').toLowerCase();
    var match = !q || name.indexOf(q) !== -1;
    t.style.display = match ? '' : 'none';
    if(match) shown++;
  });
  var counter = document.getElementById('mediaCount');
  if(counter) counter.textContent = shown + ' image' + (shown>1?'s':'');
}

function renderMediaGrid(force){
  var grid = document.getElementById('mediaGrid');
  if(!grid) return;
  loadImages(force).then(function(images){
    if(!grid || !document.getElementById('mediaGrid')) return;
    if(!images.length){
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Aucune image pour l\u2019instant.<br>Téléversez-en une pour commencer.</div>';
      return;
    }
    grid.innerHTML = images.map(function(img){
      return '<div class="thumb" data-path="'+escAttr(img.path)+'" data-name="'+escAttr(img.name)+'" title="'+escAttr(img.name)+'">'
        + '<img src="'+escAttr(img.path)+'" loading="lazy" alt="" onerror="this.parentNode.classList.add(\'placeholder-ico\');this.style.display=\'none\'">'
        + '<div class="cap">'+esc(img.name)+'</div></div>';
    }).join('');
    Array.prototype.forEach.call(grid.querySelectorAll('.thumb'), function(t){
      t.addEventListener('click', function(){
        var path = t.getAttribute('data-path');
        copyToClipboard(path);
        toast('Chemin copié : ' + path, 'ok', 2600);
      });
    });
    /* réappliquer un filtre de recherche éventuellement actif */
    var sb = document.getElementById('mediaSearch');
    var counter = document.getElementById('mediaCount');
    if(counter) counter.textContent = images.length + ' images';
    if(sb && sb.value) filterMediaGrid(sb.value);
  }).catch(function(err){
    if(grid) grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Impossible de charger les images.<br><span style="font-size:13px">'+esc(err.message)+'</span></div>';
  });
}

function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  var tmp = document.createElement('textarea');
  tmp.value = text; tmp.style.position='fixed'; tmp.style.opacity='0';
  document.body.appendChild(tmp); tmp.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(tmp);
}

/* Sélecteur modal d'image — utilisé depuis l'éditeur (couverture/insertion) */
function openImagePicker(onChoose){
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(3,5,10,.88);z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML =
    '<div style="background:var(--panel);border:1px solid var(--gold-line2);max-width:680px;width:100%;max-height:82vh;display:flex;flex-direction:column">'
    + '<div style="padding:18px 20px;border-bottom:1px solid var(--gold-line);display:flex;justify-content:space-between;align-items:center">'
    +   '<span style="font-family:var(--ff-t);font-size:20px;color:var(--gold)">Choisir une image <span id="ipCount" class="media-count"></span></span>'
    +   '<button class="btn ghost" id="ipUpload" style="padding:6px 12px;font-size:12px">&#8593; Téléverser</button>'
    + '</div>'
    + '<div style="padding:14px 16px 0"><input type="text" id="ipSearch" class="media-search" placeholder="Rechercher une image par nom…" autocomplete="off" style="margin-bottom:0"></div>'
    + '<div id="ipGrid" class="media-grid" style="padding:16px;overflow-y:auto;flex:1"><div class="center-load" style="grid-column:1/-1"><span class="spinner"></span> Chargement…</div></div>'
    + '<div style="padding:12px 20px;border-top:1px solid var(--gold-line);text-align:right"><button class="btn ghost" id="ipClose">Fermer</button></div>'
    + '</div>';
  document.body.appendChild(ov);
  function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  $('#ipClose', ov).addEventListener('click', close);
  $('#ipUpload', ov).addEventListener('click', function(){ pickAndUpload(function(path){ onChoose(path); close(); }); });

  function ipFilter(q){
    q = (q||'').toLowerCase().trim();
    var grid = $('#ipGrid', ov); if(!grid) return;
    var shown = 0;
    Array.prototype.forEach.call(grid.querySelectorAll('.thumb'), function(t){
      var name = (t.getAttribute('data-name')||'').toLowerCase();
      var match = !q || name.indexOf(q) !== -1;
      t.style.display = match ? '' : 'none';
      if(match) shown++;
    });
    var c = $('#ipCount', ov); if(c) c.textContent = shown + ' image' + (shown>1?'s':'');
  }
  $('#ipSearch', ov).addEventListener('input', function(){ ipFilter(this.value); });

  loadImages(false).then(function(images){
    var grid = $('#ipGrid', ov);
    if(!grid) return;
    if(!images.length){ grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Aucune image. Téléversez-en une.</div>'; return; }
    grid.innerHTML = images.map(function(img){
      return '<div class="thumb" data-path="'+escAttr(img.path)+'" data-name="'+escAttr(img.name)+'" title="'+escAttr(img.name)+'">'
        + '<img src="'+escAttr(img.path)+'" loading="lazy" alt="" onerror="this.parentNode.classList.add(\'placeholder-ico\');this.parentNode.firstChild.style.display=\'none\'">'
        + '<div class="cap">'+esc(img.name)+'</div></div>';
    }).join('');
    var c = $('#ipCount', ov); if(c) c.textContent = images.length + ' images';
    Array.prototype.forEach.call(grid.querySelectorAll('.thumb'), function(t){
      t.addEventListener('click', function(){ onChoose(t.getAttribute('data-path')); close(); });
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   SECTIONS EN LISTE (Minutes/audio, Secondes/galerie)
   Éditeur générique paramétré par un schéma.
   ══════════════════════════════════════════════════════════════ */

/* Schémas : décrivent les champs de chaque type d'item */
/* ══════════════════════════════════════════════════════════════
   MOSAÏQUE — géométrie des 12 formes (repère 0..1000), extraite du
   gabarit SVG. Numérotation lecture B : n°1 haut-gauche → n°12 bas.
   ══════════════════════════════════════════════════════════════ */
var MOSAIC_GEO = {"1":[[285.4,0],[0,0],[0,412.8],[235.8,289.1]],"2":[[285.8,-2],[236,290.7],[617.5,290.7],[611.4,-2]],"3":[[1000,290.7],[1000,0],[611.5,0],[617.5,290.7]],"4":[[616.1,289.7],[236,290.7],[393.5,527.1]],"5":[[1002.2,290.7],[616.1,289.7],[736.8,581.8],[1000,593.4]],"6":[[-2.4,414.1],[0,613.6],[393.4,526],[235.8,289.1]],"7":[[736.7,579.3],[616.1,289.7],[393.5,527.1],[531.9,813.1]],"8":[[-2.2,614.1],[0,813.8],[533.4,814.1],[393.4,526]],"9":[[531.9,813.1],[754.9,1000],[735.8,581.8]],"10":[[1002.2,593.5],[736.8,581.8],[755,1002.2],[1000,1000]],"11":[[265.3,1002.4],[323.7,814.7],[0,813.8],[0,1000]],"12":[[266,1000],[752.4,1000],[533.4,814.1],[323.7,814.7]]};
var MOSAIC_CENTERS = {"1":[122,171],"2":[437,148],"3":[807,145],"4":[415,369],"5":[838,430],"6":[169,465],"7":[568,552],"8":[248,696],"9":[675,799],"10":[873,792],"11":[148,905],"12":[474,920]};
var MOSAIC_N = 12;

/* Sélectionne les 12 images du mois pour le mode auto (déterministe).
   Tirage stable pour un mois donné, différent d'un mois à l'autre. */
function mosaicAutoSelection(pool, year, month){
  var visible = pool.filter(function(it){ return it.image && it.published !== false; });
  if(visible.length < MOSAIC_N) return visible.slice(); /* masquage : on renvoie ce qu'on a */
  /* graine mensuelle → mélange déterministe (Fisher-Yates seedé) */
  var seed = year * 12 + month;
  function rng(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var arr = visible.slice();
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr.slice(0, MOSAIC_N);
}

/* État courant d'une section en liste */
var listState = { key:null, schema:null, items:[], sha:null, sortMode:'manual' };

function loadSection(sectionKey){
  var schema = SECTION_SCHEMAS[sectionKey];
  return api({action:'read', file:schema.file}).then(function(res){
    var doc = JSON.parse(res.content || '{}');
    listState.key = sectionKey;
    listState.schema = schema;
    listState.items = (doc[schema.rootKey] || []).slice();
    listState.mosaic = doc.mosaic || null;   /* config mosaïque (Secondes) */
    listState.sha = res.sha;
    /* tri initial par le champ order existant */
    listState.items.sort(function(a,b){ return (a.order||999) - (b.order||999); });
    return listState.items;
  });
}

/* Renumérote le champ order selon l'ordre actuel du tableau */
function renumber(){
  listState.items.forEach(function(it, i){ it.order = i+1; });
}

/* Applique un mode de tri */
function applySortMode(mode){
  listState.sortMode = mode;
  var lf = listState.schema.labelField;
  var tf = listState.schema.timeField;
  if(mode === 'alpha'){
    listState.items.sort(function(a,b){
      return String(a[lf]||'').localeCompare(String(b[lf]||''), 'fr', {sensitivity:'base'});
    });
    renumber();
  } else if(mode === 'time'){
    var field = tf || lf;
    listState.items.sort(function(a,b){
      return String(a[field]||'').localeCompare(String(b[field]||''), 'fr', {numeric:true});
    });
    renumber();
  }
  /* 'manual' : on ne touche pas à l'ordre courant */
}

/* ── Onglet MOSAÏQUE ── */
function getMosaicConfig(){
  /* lit la config depuis listState (chargée depuis gallery.json) */
  var cfg = listState.mosaic || { mode:'auto', manual:{} };
  if(!cfg.manual) cfg.manual = {};
  return cfg;
}

function mosaicResolveImages(){
  /* renvoie un objet {formeN: imageUrl} selon le mode courant */
  var cfg = getMosaicConfig();
  var pool = listState.items.filter(function(it){ return it.image && it.published !== false; });
  var map = {};
  if(cfg.mode === 'manual'){
    for(var k=1;k<=MOSAIC_N;k++){
      var ref = cfg.manual[String(k)];
      if(ref) map[k] = ref;
    }
  } else {
    var now = new Date();
    var sel = mosaicAutoSelection(listState.items, now.getFullYear(), now.getMonth());
    for(var i=0;i<sel.length && i<MOSAIC_N;i++){ map[i+1] = sel[i].image; }
  }
  return { map:map, pool:pool };
}

function buildMosaicSvg(map, opts){
  opts = opts || {};
  var showNums = opts.numbers;
  var interactive = opts.interactive;
  var defs = '', shapes = '';
  for(var n=1;n<=MOSAIC_N;n++){
    var pts = MOSAIC_GEO[String(n)];
    var ptsAttr = pts.map(function(p){ return (p[0]/1000*500)+','+(p[1]/1000*500); }).join(' ');
    defs += '<clipPath id="mzc'+n+'"><polygon points="'+ptsAttr+'"/></clipPath>';
    var img = map[n];
    var fill;
    if(img){
      fill = '<image href="'+escAttr(imgPathG(img))+'" x="0" y="0" width="500" height="500" preserveAspectRatio="xMidYMid slice" clip-path="url(#mzc'+n+')"/>';
    } else {
      fill = '<polygon points="'+ptsAttr+'" fill="rgba(201,169,110,0.05)"/>';
    }
    var c = MOSAIC_CENTERS[String(n)];
    var cx = c[0]/1000*500, cy = c[1]/1000*500;
    var numTxt = showNums ? '<text x="'+cx+'" y="'+(cy+5)+'" fill="#F0D99A" font-size="15" text-anchor="middle" font-family="Georgia" style="pointer-events:none;paint-order:stroke;stroke:#03050A;stroke-width:3px">'+n+'</text>' : '';
    var cls = interactive ? 'mztile' : '';
    shapes += '<g class="'+cls+'" data-shape="'+n+'">'+fill
      + '<polygon points="'+ptsAttr+'" fill="'+(img?'none':'transparent')+'" stroke="#C9A96E" stroke-width="1.5"/>'
      + numTxt + '</g>';
  }
  return '<svg viewBox="-2 -2 504 504" style="width:100%;height:auto;display:block;background:#050810" xmlns="http://www.w3.org/2000/svg"><defs>'+defs+'</defs>'+shapes+'</svg>';
}

    + 'Le pool contient '+poolCount+' image'+(poolCount>1?'s':'')+' sur les 12 nécessaires. '
    + 'Les formes non remplies restent vides. Ajoutez des images dans l\u2019onglet « Pool d\u2019images ».</div>';

    warning
    + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">'
    +   '<span style="font-size:12px;color:var(--txt4)">Mode :</span>'

    +   '<span style="flex:1"></span>'
    +   '<button class="btn solid" id="mzSave">Enregistrer la mosaïque</button>'
    + '</div>'
    + '<div style="font-size:12px;color:var(--txt3);margin-bottom:16px">'
    +   (cfg.mode==='auto'
        ? 'La mosaïque change chaque mois : 12 images tirées de votre pool, placées dans l\u2019ordre. Aperçu du mois courant ci-dessous.'
        : 'Cliquez une forme puis choisissez son image. Aperçu en direct ci-dessous.')
    + '</div>'

    +   '<div style="flex:1;min-width:280px;max-width:460px" id="mzPreview">'+buildMosaicSvg(res.map, {numbers:true, interactive:(cfg.mode==='manual')})+'</div>'

    + '</div>';

  Array.prototype.forEach.call(body.querySelectorAll('.mzmode'), function(b){
    b.addEventListener('click', function(){
      cfg.mode = b.getAttribute('data-mode');
      listState.mosaic = cfg;
      state.dirty = true;
      renderMosaicTab();
    });
  });
  document.getElementById('mzSave').addEventListener('click', saveMosaic);

  renderMosaicSide();
  if(cfg.mode === 'manual') wireMosaicInteractive();
}

function renderMosaicSide(){
  var side = document.getElementById('mzSide');
  if(!side) return;
  var cfg = getMosaicConfig();
  if(cfg.mode === 'auto'){
    var now = new Date();
    var mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
    side.innerHTML = '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt4);margin-bottom:10px">Aperçu du mois</div>'
      + '<div style="font-family:var(--ff-t);font-size:20px;color:var(--gold);margin-bottom:6px">'+mois[now.getMonth()]+' '+now.getFullYear()+'</div>'
      + '<p style="font-size:13px;color:var(--txt3);line-height:1.7">Chaque mois, une nouvelle sélection s\u2019affiche automatiquement sur le site, sans intervention. Le même mois montre toujours la même mosaïque.</p>';
  } else {
    /* mode manuel : liste des 12 formes et leur image assignée */
    var cfgm = cfg.manual;
    var rows = '';
    for(var n=1;n<=MOSAIC_N;n++){
      var img = cfgm[String(n)];
      rows += '<div class="mzassign" data-shape="'+n+'" style="display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--gold-line);cursor:pointer">'
        + '<span style="width:22px;color:var(--gold);font-family:var(--ff-t)">'+n+'</span>'
        + (img ? '<img src="'+escAttr(imgPathG(img))+'" style="width:34px;height:34px;object-fit:cover;border:1px solid var(--gold-line)" onerror="this.style.visibility=\'hidden\'">' : '<span style="width:34px;height:34px;border:1px dashed var(--gold-line);display:inline-block"></span>')
        + '<span style="flex:1;font-size:12px;color:var(--txt3)">'+(img?esc(img.split('/').pop()):'— vide, cliquer pour choisir —')+'</span>'
        + (img?'<button class="btn ghost mzclear" data-shape="'+n+'" style="padding:2px 8px;font-size:11px;border-color:rgba(226,75,74,.3);color:var(--err)">×</button>':'')
        + '</div>';
    }
    side.innerHTML = '<div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt4);margin-bottom:10px">Assignation des 12 formes</div>'+rows;
    Array.prototype.forEach.call(side.querySelectorAll('.mzassign'), function(r){
      r.addEventListener('click', function(e){
        if(e.target.classList.contains('mzclear')) return;
        assignShapeImage(parseInt(r.getAttribute('data-shape'),10));
      });
    });
    Array.prototype.forEach.call(side.querySelectorAll('.mzclear'), function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var n = b.getAttribute('data-shape');
        delete getMosaicConfig().manual[n];
        listState.mosaic = getMosaicConfig();
        state.dirty = true;
        renderMosaicTab();
      });
    });
  }
}

/* clic sur une forme du SVG (mode manuel) → choisir une image */
function wireMosaicInteractive(){
  var prev = document.getElementById('mzPreview');
  if(!prev) return;
  Array.prototype.forEach.call(prev.querySelectorAll('.mztile'), function(g){
    g.style.cursor = 'pointer';
    g.addEventListener('click', function(){
      assignShapeImage(parseInt(g.getAttribute('data-shape'),10));
    });
  });
}

function assignShapeImage(shapeNum){
  /* sélecteur limité au pool de la galerie */
  openGalleryImagePicker(function(imagePath){
    var cfg = getMosaicConfig();
    cfg.manual[String(shapeNum)] = imagePath;
    listState.mosaic = cfg;
    state.dirty = true;
    renderMosaicTab();
  });
}

  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  document.getElementById('gpClose').addEventListener('click', close);
  Array.prototype.forEach.call(ov.querySelectorAll('.gpick'), function(g){
    g.addEventListener('click', function(){ onChoose(g.getAttribute('data-img')); close(); });

function saveMosaic(){
  var cfg = getMosaicConfig();
  /* on réécrit gallery.json en préservant items + en ajoutant/màj mosaic */
  var doc = { items: listState.items, mosaic: cfg };
  var content = JSON.stringify(doc, null, 2);
  var btn = document.getElementById('mzSave');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Enregistrement…'; }
  api({action:'write', file:'data/gallery.json', content:content, sha:listState.sha,
       message:'Horloger : mosaïque Secondes ('+cfg.mode+')'})
  .then(function(res){
    listState.sha = res.sha;
    state.dirty = false;
    toast('Mosaïque enregistrée ✓', 'ok', 2800);
    if(btn){ btn.disabled=false; btn.textContent='Enregistrer la mosaïque'; }
  }).catch(function(err){
    if(btn){ btn.disabled=false; btn.textContent='Enregistrer la mosaïque'; }
    if(err.status===409) toast('Conflit : rechargez (changement externe).', 'err', 4000);
    else toast('Échec : '+err.message, 'err', 4000);
  });
}

function renderSectionListInto(targetId){
  var schema = listState.schema;
  var main = document.getElementById(targetId);
  var isEmbedded = (targetId !== 'main');
  var rows = listState.items.map(function(it, i){
    var label = esc(it[schema.labelField] || '(sans titre)');
    var thumb = '';
    if(schema.rootKey === 'items' && it.image){
      thumb = '<img src="'+escAttr(imgPathG(it.image))+'" alt="" style="width:44px;height:44px;object-fit:cover;border:1px solid var(--gold-line);flex:none" onerror="this.style.visibility=\'hidden\'">';
    }
    var sub = '';
    if(it.poet) sub = esc(it.poet);
    if(schema.rootKey === 'tracks' && it.youtube) sub += (sub?' · ':'')+'YouTube';
    var pubTag = (it.published===false) ? '<em class="tag draft">Masqué</em>' : '<em class="tag pub">Visible</em>';
    return '<div class="lrow" draggable="true" data-idx="'+i+'">'
      + '<span class="drag-handle" title="Glisser pour réordonner">&#8942;&#8942;</span>'
      + thumb
      + '<span style="flex:1;min-width:0"><span style="color:var(--txt);display:block">'+label+'</span>'
      +   (sub?'<span style="font-size:11px;color:var(--txt3)">'+sub+'</span>':'')+'</span>'
      + pubTag
      + '<button class="btn ghost lrow-edit" data-idx="'+i+'" style="padding:5px 10px;font-size:12px">Éditer</button>'
      + '<button class="btn ghost lrow-del" data-idx="'+i+'" style="padding:5px 9px;font-size:12px;border-color:rgba(226,75,74,.3);color:var(--err)">&#215;</button>'
      + '</div>';
  }).join('');

  main.innerHTML =
   (isEmbedded ? '' : '<div class="vhead"><div class="vtitle">'+esc(schema.title)+'</div></div>')
   + '<div class="vactions" style="justify-content:flex-end;margin-bottom:14px"><button class="btn solid" id="btnAddItem">+ Ajouter une '+schema.singular+'</button></div>'
   + '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">'
   +   '<span style="font-size:12px;color:var(--txt4)">Ordre :</span>'
   +   '<button class="btn ghost sortbtn" data-sort="manual" style="padding:5px 12px;font-size:12px">Manuel (glisser)</button>'
   +   '<button class="btn ghost sortbtn" data-sort="alpha" style="padding:5px 12px;font-size:12px">A→Z</button>'
   +   '<button class="btn ghost sortbtn" data-sort="time" style="padding:5px 12px;font-size:12px">Chronologique</button>'
   +   '<span style="flex:1"></span>'
   +   '<button class="btn solid" id="btnSaveSection">Enregistrer l\u2019ordre</button>'
   + '</div>'
   + '<div style="font-size:12px;color:var(--txt3);margin-bottom:12px">Glissez les lignes pour réordonner, ou triez automatiquement. N\u2019oubliez pas d\u2019enregistrer.</div>'
   + '<div id="lrows">' + (listState.items.length ? rows : '<div class="empty">Aucune '+schema.singular+' pour l\u2019instant.</div>') + '</div>';

  /* Boutons de tri */
  Array.prototype.forEach.call(main.querySelectorAll('.sortbtn'), function(b){
    if(b.getAttribute('data-sort')===listState.sortMode) b.style.borderColor='var(--gold-soft)';
    b.addEventListener('click', function(){
      applySortMode(b.getAttribute('data-sort'));
      state.dirty = true;
      renderSectionList();
    });
  });
  $('#btnAddItem').addEventListener('click', function(){ openItemEditor(null); });
  $('#btnSaveSection').addEventListener('click', saveSection);

  /* Édition / suppression */
  Array.prototype.forEach.call(main.querySelectorAll('.lrow-edit'), function(b){
    b.addEventListener('click', function(){ openItemEditor(parseInt(b.getAttribute('data-idx'),10)); });
  });
  Array.prototype.forEach.call(main.querySelectorAll('.lrow-del'), function(b){
    b.addEventListener('click', function(){
      var idx = parseInt(b.getAttribute('data-idx'),10);
      var it = listState.items[idx];
      if(confirm('Supprimer « '+(it[schema.labelField]||'cet élément')+' » ?')){
        listState.items.splice(idx,1); renumber(); state.dirty=true; renderSectionList();
      }
    });
  });

  setupDragDrop();
}

function imgPathG(u){
  if(!u) return '';
  if(/^https?:\/\//.test(u) || u.charAt(0)==='/') return u;
  return '/'+u;
}

/* Glisser-déposer pour réordonner */
function setupDragDrop(){
  var container = document.getElementById('lrows');
  if(!container) return;
  var dragEl = null;
  Array.prototype.forEach.call(container.querySelectorAll('.lrow'), function(row){
    row.addEventListener('dragstart', function(e){ dragEl = row; row.style.opacity='0.4'; e.dataTransfer.effectAllowed='move'; });
    row.addEventListener('dragend', function(){ row.style.opacity=''; });
    row.addEventListener('dragover', function(e){ e.preventDefault(); e.dataTransfer.dropEffect='move';
      var rect = row.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      row.style.borderTop = after ? '' : '2px solid var(--gold)';
      row.style.borderBottom = after ? '2px solid var(--gold)' : '';
    });
    row.addEventListener('dragleave', function(){ row.style.borderTop=''; row.style.borderBottom=''; });
    row.addEventListener('drop', function(e){
      e.preventDefault();
      row.style.borderTop=''; row.style.borderBottom='';
      if(!dragEl || dragEl===row) return;
      var from = parseInt(dragEl.getAttribute('data-idx'),10);
      var to = parseInt(row.getAttribute('data-idx'),10);
      var rect = row.getBoundingClientRect();
      var after = (e.clientY - rect.top) > rect.height/2;
      var moved = listState.items.splice(from,1)[0];
      var insertAt = to + (after?1:0);
      if(from < insertAt) insertAt--;
      listState.items.splice(insertAt, 0, moved);
      renumber();
      listState.sortMode = 'manual';
      state.dirty = true;
      renderSectionList();
    });
  });
}

/* Éditeur modal d'un item (ajout ou édition) */
function openItemEditor(idx){
  var schema = listState.schema;
  var isNew = (idx === null);
  var item = isNew ? {} : Object.assign({}, listState.items[idx]);

  var fieldsHtml = schema.fields.map(function(f){
    var val = (item[f.key] != null ? item[f.key] : (f.def != null ? f.def : ''));
    if(f.type === 'bool'){
      return '<label style="display:block;margin:16px 0 6px;font-size:13px;color:var(--txt2);cursor:pointer"><input type="checkbox" id="if_'+f.key+'" '+(val?'checked':'')+' style="accent-color:var(--gold);vertical-align:-2px"> '+esc(f.label)+'</label>';
    }
    if(f.type === 'textarea'){
      return '<label class="fl">'+esc(f.label)+(f.required?' *':'')+'</label>'
        + '<textarea class="fi" id="if_'+f.key+'" rows="3">'+esc(val)+'</textarea>';
    }
    if(f.type === 'image'){
      return '<label class="fl">'+esc(f.label)+(f.required?' *':'')+'</label>'
        + '<div style="display:flex;gap:8px"><input class="fi" id="if_'+f.key+'" value="'+escAttr(val)+'" placeholder="/images/uploads/…"><button class="btn ghost" type="button" id="ifpick_'+f.key+'" style="flex:0 0 auto;padding:0 14px">&#9635;</button></div>'
        + '<div id="ifprev_'+f.key+'" style="margin-top:8px">'+(val?'<img src="'+escAttr(imgPathG(val))+'" style="max-height:120px;border:1px solid var(--gold-line)">':'')+'</div>';
    }
    if(f.type === 'audio'){
      return '<label class="fl">'+esc(f.label)+(f.required?' *':'')+'</label>'
        + '<div style="display:flex;gap:8px"><input class="fi" id="if_'+f.key+'" value="'+escAttr(val)+'" placeholder="/images/uploads/piste.mp3"><button class="btn ghost" type="button" id="ifup_'+f.key+'" style="flex:0 0 auto;padding:0 14px" title="Téléverser un fichier audio">&#8593;</button></div>'
        + '<div id="ifprev_'+f.key+'" style="margin-top:8px">'+(val?'<audio controls preload="none" src="'+escAttr(imgPathG(val))+'" style="width:100%;height:34px"></audio>':'')+'</div>';
    }
    return '<label class="fl">'+esc(f.label)+(f.required?' *':'')+'</label>'
      + '<input class="fi" id="if_'+f.key+'" value="'+escAttr(val)+'"'+(f.placeholder?' placeholder="'+escAttr(f.placeholder)+'"':'')+'>';
  }).join('');

  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(3,5,10,.88);z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML =
    '<div style="background:var(--panel);border:1px solid var(--gold-line2);max-width:460px;width:100%;max-height:86vh;overflow-y:auto;padding:26px 24px">'
    + '<div style="font-family:var(--ff-t);font-size:21px;color:var(--gold);margin-bottom:8px">'+(isNew?'Ajouter':'Éditer')+' une '+schema.singular+'</div>'
    + fieldsHtml
    + '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:22px">'
    +   '<button class="btn ghost" id="itemCancel">Annuler</button>'
    +   '<button class="btn solid" id="itemOk">'+(isNew?'Ajouter':'Valider')+'</button>'
    + '</div></div>';
  document.body.appendChild(ov);
  function close(){ if(ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  $('#itemCancel', ov).addEventListener('click', close);

  /* sélecteurs d'image + téléversement audio */
  schema.fields.forEach(function(f){
    if(f.type === 'image'){
      var pickBtn = $('#ifpick_'+f.key, ov);
      pickBtn.addEventListener('click', function(){
        openImagePicker(function(path){
          $('#if_'+f.key, ov).value = path;
          $('#ifprev_'+f.key, ov).innerHTML = '<img src="'+escAttr(imgPathG(path))+'" style="max-height:120px;border:1px solid var(--gold-line)">';
        });
      });
    }
    if(f.type === 'audio'){
      var upBtn = $('#ifup_'+f.key, ov);
      upBtn.addEventListener('click', function(){
        pickAndUploadAudio(function(path){
          $('#if_'+f.key, ov).value = path;
          $('#ifprev_'+f.key, ov).innerHTML = '<audio controls preload="none" src="'+escAttr(imgPathG(path))+'" style="width:100%;height:34px"></audio>';
        });
      });
    }
  });

  $('#itemOk', ov).addEventListener('click', function(){
    var newItem = isNew ? {} : Object.assign({}, listState.items[idx]);
    var ok = true;
    schema.fields.forEach(function(f){
      var inp = $('#if_'+f.key, ov);
      if(f.type === 'bool'){ newItem[f.key] = inp.checked; }
      else {
        var v = inp.value.trim();
        if(f.required && !v){ ok=false; inp.style.borderColor='var(--err)'; }
        newItem[f.key] = v;
      }
    });
    if(!ok){ toast('Remplissez les champs obligatoires.', 'err'); return; }
    if(isNew){
      newItem.order = listState.items.length + 1;
      listState.items.push(newItem);
    } else {
      listState.items[idx] = newItem;
    }
    state.dirty = true;
    close();
    renderSectionList();
  });
}

function saveSection(){
  var schema = listState.schema;
  renumber();
  var doc = {};
  doc[schema.rootKey] = listState.items;
  /* Secondes : ne pas perdre la config mosaïque lors d'un enregistrement du pool */
  if(listState.key === 'secondes' && listState.mosaic){ doc.mosaic = listState.mosaic; }
  var content = JSON.stringify(doc, null, 2);
  var btn = document.getElementById('btnSaveSection');
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Enregistrement…'; }
  api({action:'write', file:schema.file, content:content, sha:listState.sha,
       message:'Horloger : mise à jour '+schema.file})
  .then(function(res){
    listState.sha = res.sha;
    state.dirty = false;
    toast('Section enregistrée ✓', 'ok', 2800);
    if(btn){ btn.disabled=false; btn.textContent='Enregistrer l\u2019ordre'; }
  }).catch(function(err){
    if(btn){ btn.disabled=false; btn.textContent='Enregistrer l\u2019ordre'; }
    if(err.status===409) toast('Conflit : rechargez la section (changement externe).', 'err', 4000);
    else toast('Échec : '+err.message, 'err', 4000);
  });
}

/* ══════════════════════════════════════════════════════════════
   ROUTAGE + THÈME + DÉMARRAGE
   ══════════════════════════════════════════════════════════════ */
var VIEWS = {
  edit: function(){viewEdit();}, list: viewList, plan: viewPlan, dash: viewDash, media: viewMedia,
  minutes: function(){ viewSection('minutes'); },
  secondes: function(){ viewSection('secondes'); }
};

function setActive(name){
  Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function(a){
    a.classList.toggle('active', a.getAttribute('data-view')===name);
  });
}
function go(name){
  if(state.dirty && !confirm('Abandonner les modifications non enregistrées ?')) return;
  state.dirty = false;
  setActive(name);
  (VIEWS[name] || viewList)();
}

function applyTheme(t){
  if(t==='light') document.documentElement.setAttribute('data-theme','light');
  else document.documentElement.removeAttribute('data-theme');
  var icon = document.getElementById('themeIcon');
  if(icon) icon.innerHTML = t==='light' ? '&#9789;' : '&#9788;';
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
}
function initTheme(){
  var t = 'dark';
  try{ t = localStorage.getItem(THEME_KEY) || 'dark'; }catch(e){}
  applyTheme(t);
}

function openApp(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('whoami').textContent = '\u25C9 ' + state.login;
  var main = document.getElementById('main');
  main.innerHTML = '<div class="center-load"><span class="spinner"></span> Ouverture de l\u2019atelier…</div>';
  loadPosts().then(function(){
    go('edit');
  }).catch(function(err){
    main.innerHTML = '<div class="empty">Impossible de charger les textes.<br><span style="font-size:13px">'+esc(err.message)+'</span></div>';
  });
}

/* ── Câblage global ── */
document.getElementById('loginBtn').addEventListener('click', startLogin);
document.getElementById('themeToggle').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme')==='light' ? 'light' : 'dark';
  applyTheme(cur==='light' ? 'dark' : 'light');
});
Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function(a){
  a.addEventListener('click', function(e){ e.preventDefault(); go(a.getAttribute('data-view')); });
});

/* Prévenir la perte de données sur fermeture d'onglet */
window.addEventListener('beforeunload', function(e){
  if(state.dirty){ e.preventDefault(); e.returnValue=''; }
});

initTheme();
trySilentLogin();

})();
</script>
