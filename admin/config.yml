backend:
  name: github
  repo: JyDiel-Nero/entre-ici-et-ailleurs
  branch: main
  base_url: https://entre-ici-et-ailleurs.pages.dev
  auth_endpoint: /api/auth

media_folder: "images"
public_folder: "/images"
locale: "fr"

collections:
  - name: "articles"
    label: "⏳ Heures — Articles & Poèmes"
    files:
      - file: "data/posts.json"
        name: "tous_les_articles"
        label: "Gérer les publications"
        fields:
          - name: "posts"
            widget: "list"
            label: "Publications"
            collapsed: true
            summary: "{{fields.title}} — {{fields.tag}}"
            fields:
              - { name: slug, widget: string, label: "Slug (unique, tirets)" }
              - { name: title, widget: string, label: "Titre" }
              - { name: date, widget: string, label: "Date d'écriture" }
              - { name: publishDate, widget: datetime, label: "Publication programmée", required: false }
              - { name: author, widget: string, label: "Auteur", required: false, default: "J.Y.D.", hint: "Laisser vide pour J.Y.D." }
              - { name: tag, widget: string, label: "Catégorie", hint: "Ex: MÉDITATION, POÉSIE, PRIÈRE, RÉFLEXION, RÉCIT" }
              - { name: excerpt, widget: text, label: "Extrait" }
              - { name: cover, widget: image, label: "Image couverture", required: false }
              - { name: cover_alt, widget: string, label: "Alt couverture", required: false, hint: "Description de l'image pour l'accessibilité" }
              - { name: thumb, widget: image, label: "Miniature", required: false }
              - { name: thumb_alt, widget: string, label: "Alt miniature", required: false, hint: "Description de la miniature" }
              - { name: body, widget: markdown, label: "Contenu" }
              - { name: instagram_link, widget: string, label: "Lien Instagram (article)", required: false }
              - { name: tiktok_link, widget: string, label: "Lien TikTok (article)", required: false }
              - { name: youtube_link, widget: string, label: "Lien YouTube (article)", required: false }
              - { name: published, widget: boolean, label: "Publié", default: true }

  - name: "oeuvres"
    label: "🍂 Saisons — Recueils & Œuvres"
    files:
      - file: "data/oeuvres.json"
        name: "toutes_les_oeuvres"
        label: "Recueils, albums, tableaux"
        fields:
          - name: "oeuvres"
            widget: "list"
            label: "Œuvres"
            collapsed: true
            summary: "{{fields.title}} ({{fields.type}})"
            fields:
              - { name: title, widget: string, label: "Titre" }
              - { name: type, widget: select, label: "Type", options: [{ label: "📖 Recueil", value: "recueil" }, { label: "🎤 Album", value: "album" }, { label: "🎨 Peinture", value: "peinture" }] }
              - { name: description, widget: text, label: "Description", required: false }
              - { name: image, widget: image, label: "Image/couverture" }
              - { name: image_alt, widget: string, label: "Alt image", required: false, hint: "Description pour l'accessibilité" }
              - { name: price, widget: string, label: "Prix", required: false }
              - { name: amazon, widget: string, label: "Lien Amazon", required: false }
              - { name: bookelis, widget: string, label: "Lien Bookelis", required: false }
              - { name: fnac, widget: string, label: "Lien Fnac", required: false }
              - { name: spotify, widget: string, label: "Lien Spotify/streaming", required: false }
              - { name: other_link, widget: string, label: "Autre lien", required: false }
              - { name: other_label, widget: string, label: "Texte du lien", required: false, default: "Acheter" }
              - { name: order, widget: number, label: "Ordre", default: 1 }
              - { name: published, widget: boolean, label: "Publié", default: true }

  - name: "audio"
    label: "🎵 Minutes — Audio"
    files:
      - file: "data/audio.json"
        name: "tous_les_audios"
        label: "Enregistrements"
        fields:
          - name: tracks
            widget: list
            label: "Enregistrements"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, widget: string, label: "Titre" }
              - { name: poet, widget: string, label: "Auteur", required: false, default: "J.Y.D." }
              - { name: description, widget: text, label: "Description", required: false }
              - { name: file, widget: file, label: "Fichier MP3", required: false }
              - { name: youtube, widget: string, label: "Lien YouTube", required: false }
              - { name: instagram, widget: string, label: "Lien Instagram", required: false }
              - { name: tiktok, widget: string, label: "Lien TikTok", required: false }
              - { name: link, widget: string, label: "Autre lien", required: false }
              - { name: link_label, widget: string, label: "Texte du lien", required: false, default: "Écouter" }
              - { name: cover, widget: image, label: "Couverture", required: false }
              - { name: order, widget: number, label: "Ordre", default: 1 }
              - { name: published, widget: boolean, label: "Publié", default: true }

  - name: "galerie"
    label: "📷 Secondes — Images"
    files:
      - file: "data/gallery.json"
        name: "toutes_les_images"
        label: "Galerie visuelle"
        fields:
          - name: items
            widget: list
            label: "Images"
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, widget: string, label: "Légende" }
              - { name: image, widget: image, label: "Image" }
              - { name: image_alt, widget: string, label: "Alt image", required: false, hint: "Description pour l'accessibilité" }
              - { name: order, widget: number, label: "Ordre", default: 1 }

  - name: "sections_custom"
    label: "➕ Sections perso"
    files:
      - file: "data/custom-sections.json"
        name: "sections"
        label: "Créer des sections"
        fields:
          - name: "sections"
            widget: "list"
            label: "Sections personnalisées"
            collapsed: true
            summary: "{{fields.name}} ({{fields.type}})"
            fields:
              - { name: id, widget: string, label: "Identifiant (minuscules, tirets)" }
              - { name: name, widget: string, label: "Nom affiché" }
              - { name: type, widget: select, label: "Type", options: [{ label: "📝 Blog", value: "blog" }, { label: "🖼️ Galerie", value: "gallery" }, { label: "📄 Texte", value: "text" }, { label: "🔗 Liens", value: "links" }] }
              - { name: subtitle, widget: string, label: "Sous-titre", required: false }
              - { name: visible, widget: boolean, label: "Visible", default: false }
              - { name: categories, widget: list, label: "Sous-catégories", required: false, fields: [{ name: name, widget: string, label: "Nom" }] }
              - { name: content, widget: markdown, label: "Contenu (type texte)", required: false }
              - { name: items, widget: list, label: "Éléments", required: false, collapsed: true, summary: "{{fields.title}}", fields: [{ name: title, widget: string, label: "Titre" }, { name: text, widget: text, label: "Texte", required: false }, { name: image, widget: image, label: "Image", required: false }, { name: link, widget: string, label: "Lien", required: false }, { name: category, widget: string, label: "Catégorie", required: false }, { name: published, widget: boolean, label: "Publié", default: true }] }

  - name: "param_general"
    label: "⚙️ Cadran — Général"
    files:
      - file: "data/settings.json"
        name: "site"
        label: "Textes et images du site"
        fields:
          - { name: hero_bg, widget: image, label: "Image de fond Cadran (horloge)", required: false }
          - { name: manifeste_bg, widget: image, label: "Image de fond Manifeste (grande roue)", required: false }
          - { name: site_bg, widget: image, label: "Image de fond globale", required: false }
          - { name: hero_title, widget: string, label: "Titre Cadran", default: "JyDiel In-Time" }
          - { name: hero_subtitle, widget: string, label: "Sous-titre Cadran", required: false }
          - { name: tagline, widget: string, label: "Tagline", required: false }
          - { name: man1, widget: string, label: "Manifeste ligne 1" }
          - { name: man2, widget: string, label: "Manifeste ligne 2" }
          - { name: apropos, widget: text, label: "Texte Un instant (à propos)" }
          - { name: contact_label, widget: string, label: "Entretemps — label", required: false, default: "ENTRETEMPS" }
          - { name: contact_title, widget: string, label: "Entretemps — titre", required: false, default: "Et ensuite ?" }
          - { name: contact_subtitle, widget: string, label: "Entretemps — sous-titre", required: false, default: "Le chemin ne s'arrête pas ici." }
          - { name: contact_note, widget: string, label: "Entretemps — note formulaire", required: false, default: "Pas de bruit. Juste des mots, de temps en temps." }
          - { name: nl_success_title, widget: string, label: "Newsletter — titre confirmation", required: false, default: "Bienvenue dans le Temps" }
          - { name: nl_success_text, widget: text, label: "Newsletter — texte confirmation", required: false }
          - { name: instagram, widget: string, label: "Instagram (URL)", required: false }
          - { name: tiktok, widget: string, label: "TikTok (URL)", required: false }
          - { name: privacy_text, widget: text, label: "Texte Confidentialité", required: false }

  - name: "param_sections"
    label: "📂 Visibilité des sections"
    files:
      - file: "data/sections-config.json"
        name: "sc"
        label: "Afficher/masquer, renommer, routes et pagination"
        fields:
          - { name: name_blog, widget: string, label: "Nom : Heures", default: "Heures" }
          - { name: subtitle_blog, widget: string, label: "Sous-titre : Heures", default: "Entre ici et ailleurs", required: false }
          - { name: route_blog, widget: string, label: "URL : Heures", default: "heures" }
          - { name: show_blog, widget: boolean, label: "✅ Afficher Heures (articles)", default: true }
          - { name: name_audio, widget: string, label: "Nom : Minutes", default: "Minutes" }
          - { name: subtitle_audio, widget: string, label: "Sous-titre : Minutes", default: "Écouter", required: false }
          - { name: route_audio, widget: string, label: "URL : Minutes", default: "minutes" }
          - { name: show_audio, widget: boolean, label: "✅ Afficher Minutes (audio)", default: true }
          - { name: name_univers, widget: string, label: "Nom : Secondes", default: "Secondes" }
          - { name: subtitle_univers, widget: string, label: "Sous-titre : Secondes", default: "Voir", required: false }
          - { name: route_univers, widget: string, label: "URL : Secondes", default: "secondes" }
          - { name: show_univers, widget: boolean, label: "✅ Afficher Secondes (images)", default: true }
          - { name: name_oeuvres, widget: string, label: "Nom : Saisons", default: "Saisons" }
          - { name: subtitle_oeuvres, widget: string, label: "Sous-titre : Saisons", default: "Cœur Assaisonné", required: false }
          - { name: route_oeuvres, widget: string, label: "URL : Saisons", default: "saisons" }
          - { name: show_oeuvres, widget: boolean, label: "✅ Afficher Saisons (œuvres)", default: false }
          - { name: name_apropos, widget: string, label: "Nom : Un instant", default: "Un instant" }
          - { name: subtitle_apropos, widget: string, label: "Sous-titre : Un instant", default: "Qui est JyD ?", required: false }
          - { name: route_apropos, widget: string, label: "URL : Un instant", default: "un-instant" }
          - { name: show_apropos, widget: boolean, label: "✅ Afficher Un instant (à propos)", default: true }
          - { name: name_contact, widget: string, label: "Nom : Entretemps", default: "Entretemps" }
          - { name: subtitle_contact, widget: string, label: "Sous-titre : Entretemps", default: "Et ensuite ?", required: false }
          - { name: route_contact, widget: string, label: "URL : Entretemps", default: "entretemps" }
          - { name: show_contact, widget: boolean, label: "✅ Afficher Entretemps (contact)", default: true }
          - { name: home_label_latest, widget: string, label: "Cadran — label dernier texte", default: "DERNIER TEXTE", required: false }
          - { name: home_label_recent, widget: string, label: "Cadran — label textes récents", default: "TEXTES RÉCENTS", required: false }
          - { name: home_label_gallery, widget: string, label: "Cadran — label galerie", default: "SECONDES", required: false }
          - { name: home_btn_readall, widget: string, label: "Cadran — bouton lire tout", default: "Lire tous les textes", required: false }
          - { name: home_btn_author, widget: string, label: "Cadran — bouton auteur", default: "Découvrir l'auteur", required: false }
          - { name: blog_per_page, widget: string, label: "Publications par page (Heures)", default: "6" }
          - { name: oeuvres_per_page, widget: string, label: "Œuvres par page (Saisons)", default: "12" }
          - { name: audio_per_page, widget: string, label: "Pistes par page (Minutes)", default: "12" }
          - { name: univers_shuffle, widget: boolean, label: "🔀 Mélanger les images (Secondes)", default: false }
          - { name: show_rss, widget: boolean, label: "📡 Afficher lien RSS dans le footer", default: true }
          - name: blog_categories
            widget: list
            label: "Catégories (Heures)"
            fields: [{ name: name, widget: string, label: "Nom" }]
            default: [{ name: "MÉDITATION" }, { name: "POÉSIE" }, { name: "PRIÈRE" }, { name: "RÉFLEXION" }, { name: "RÉCIT" }]

  - name: "param_themes"
    label: "🌗 Thèmes du site"
    files:
      - file: "data/theme-config.json"
        name: "theme_toggle"
        label: "Activer/désactiver les thèmes"
        fields:
          - { name: theme_default, widget: select, label: "Thème par défaut", default: "dark", options: [{ label: "🌙 Nuit", value: "dark" }, { label: "☀️ Jour", value: "light" }, { label: "◐ Sépia", value: "sepia" }, { label: "☀ Notos (été)", value: "notos" }, { label: "◐ Argeste (automne)", value: "argeste" }, { label: "❄ Borée (hiver)", value: "boree" }, { label: "❀ Zéphyr (printemps)", value: "zephyr" }] }
          - { name: theme_enable_dark, widget: boolean, label: "🌙 Thème Nuit disponible", default: true }
          - { name: theme_enable_light, widget: boolean, label: "☀️ Thème Jour disponible", default: true }
          - { name: theme_enable_sepia, widget: boolean, label: "◐ Thème Sépia disponible", default: true }
          - { name: theme_enable_notos, widget: boolean, label: "☀ Notos — été", default: false }
          - { name: theme_enable_argeste, widget: boolean, label: "◐ Argeste — automne", default: false }
          - { name: theme_enable_boree, widget: boolean, label: "❄ Borée — hiver", default: false }
          - { name: theme_enable_zephyr, widget: boolean, label: "❀ Zéphyr — printemps", default: false }

  - name: "param_colors"
    label: "🎨 Couleurs & polices"
    files:
      - file: "data/theme.json"
        name: "theme"
        label: "Personnalisation visuelle"
        fields:
          - { name: theme_deep, widget: color, label: "🌙 Nuit — fond principal", required: false, default: "#03050A" }
          - { name: theme_night, widget: color, label: "🌙 Nuit — fond sections", required: false, default: "#060D18" }
          - { name: theme_ink, widget: color, label: "🌙 Nuit — fond encarts", required: false, default: "#0D1D2C" }
          - { name: theme_gold, widget: color, label: "🌙 Nuit — accent (or)", required: false, default: "#C9A96E" }
          - { name: theme_gold_light, widget: color, label: "🌙 Nuit — accent clair", required: false, default: "#E8C98A" }
          - { name: theme_gold_dark, widget: color, label: "🌙 Nuit — accent foncé", required: false, default: "#A8884E" }
          - { name: light_deep, widget: color, label: "☀️ Jour — fond principal", required: false, default: "#FFFDF9" }
          - { name: light_gold, widget: color, label: "☀️ Jour — accent (bleu)", required: false, default: "#14325A" }
          - { name: light_gold_light, widget: color, label: "☀️ Jour — accent clair", required: false, default: "#0C2444" }
          - { name: light_gold_dark, widget: color, label: "☀️ Jour — accent foncé", required: false, default: "#3D6BA3" }
          - { name: theme_font_title, widget: select, label: "Police titres", required: false, default: "Cormorant Garamond", options: ["Cormorant Garamond", "Playfair Display", "Lora", "EB Garamond", "Libre Baskerville", "Crimson Text", "Spectral", "DM Serif Display", "Bodoni Moda", "Cormorant"] }
          - { name: theme_font_body, widget: select, label: "Police texte", required: false, default: "Merriweather", options: ["Merriweather", "Lora", "Source Serif 4", "Libre Baskerville", "Crimson Text", "Spectral", "Newsreader", "Literata", "Bitter", "PT Serif"] }
          - { name: theme_section_opacity, widget: select, label: "Transparence sections", required: false, default: "0.85", options: [{ label: "Très transparent", value: "0.4" }, { label: "Semi-transparent", value: "0.6" }, { label: "Modéré", value: "0.85" }, { label: "Opaque", value: "0.95" }, { label: "Complètement opaque", value: "1" }] }
