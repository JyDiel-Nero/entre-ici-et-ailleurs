<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — JyDiel In-Time</title>
  <style id="cms-dark-theme">
    /* ═══ RESET ═══ */
    *, *::before, *::after { border-color: rgba(201,169,110,.1) !important; }
    html, body, #nc-root, #root, [id="nc-root"] > div, [id="nc-root"] > div > div {
      background-color: #0D0F12 !important; color: rgba(201,169,110,.7) !important;
    }
    div, section, main, aside, nav, article, footer, header, form, fieldset, details, summary,
    ul, ol, li, dl, dt, dd, figure, figcaption, [class*="css-"] {
      background-color: transparent !important; color: inherit;
    }
    header, [class*="AppHeader"], #nc-root > div > div > header {
      background-color: #111620 !important; border-bottom: 1px solid rgba(201,169,110,.08) !important;
    }
    header *, [class*="AppHeader"] * { color: #C9A96E !important; background-color: transparent !important; }
    aside, [class*="Sidebar"], nav[class*="css-"] { background-color: #111620 !important; }
    aside a, nav a, aside li, nav li, aside span, nav span { color: rgba(201,169,110,.5) !important; background-color: transparent !important; }
    aside a:hover, nav a:hover, aside a[class*="active"], aside a[aria-current="page"] { color: #E8C98A !important; background-color: rgba(201,169,110,.04) !important; }
    main, [class*="Main"], section { background-color: #0D0F12 !important; }
    h1,h2,h3,h4,h5,h6 { color: #C9A96E !important; background-color: transparent !important; }
    h2 { text-transform: uppercase !important; letter-spacing: .06em !important; font-size: 14px !important; }
    label, legend, [class*="ControlLabel"], [class*="Label"] {
      color: #A8884E !important; background-color: transparent !important;
      text-transform: uppercase !important; letter-spacing: .06em !important; font-size: 11px !important;
    }
    p, span, li, td, th, div, summary, a { color: rgba(201,169,110,.6); background-color: transparent !important; }
    small, [class*="hint"], [class*="Hint"] { color: rgba(201,169,110,.3) !important; }

    /* ═══ INPUTS ═══ */
    input[type="text"],input[type="number"],input[type="url"],input[type="email"],input[type="password"],
    input[type="datetime-local"],input[type="date"],textarea,select {
      background-color: #080A0E !important; border: 1px solid rgba(201,169,110,.12) !important;
      color: #E8C98A !important; border-radius: 3px !important; padding: 10px 12px !important;
    }
    input:focus,textarea:focus,select:focus { border-color: #C9A96E !important; outline: none !important; }
    input[type="checkbox"] { accent-color: #C9A96E !important; }
    select { appearance: auto !important; }

    /* ═══ BUTTONS ═══ */
    button { background-color: transparent !important; color: #C9A96E !important; border: 1px solid rgba(201,169,110,.12) !important; border-radius: 3px !important; }
    button:hover { border-color: rgba(201,169,110,.25) !important; background-color: rgba(201,169,110,.04) !important; }
    [class*="ublish"] button { background-color: rgba(201,169,110,.1) !important; border-color: rgba(201,169,110,.25) !important; color: #E8C98A !important; }

    /* ═══ LIST ITEMS ═══ */
    fieldset, details { background-color: transparent !important; border: 1px solid rgba(201,169,110,.06) !important; border-radius: 4px !important; }
    fieldset:hover, details:hover { border-color: rgba(201,169,110,.12) !important; }
    [class*="ListCard"],[class*="EntryCard"],[class*="listCard"],[class*="entryCard"],
    [class*="ObjectControl"],[class*="ListItemTopBar"],[class*="TopBar"],
    [class*="ExpandedListItem"],[class*="ListItem"],
    [class*="css-"][draggable="true"], li[class*="css-"], li > div[class*="css-"] {
      background-color: transparent !important; background: transparent !important;
    }

    /* ═══ EDITOR ═══ */
    [contenteditable="true"],[data-slate-editor="true"] { background-color: #080A0E !important; color: rgba(201,169,110,.7) !important; caret-color: #E8C98A !important; }
    [class*="toolbar"],[class*="Toolbar"] { background-color: #111620 !important; }
    [class*="toolbar"] button,[class*="Toolbar"] button { color: rgba(201,169,110,.4) !important; border: none !important; }
    a { color: #C9A96E !important; } a:hover { color: #E8C98A !important; }

    /* ═══ DROPDOWNS ═══ */
    ul[role="listbox"],div[role="listbox"],[class*="MenuList"],[class*="menu"] {
      background-color: #151A22 !important; border: 1px solid rgba(201,169,110,.1) !important;
    }
    [class*="option"]:hover { background-color: rgba(201,169,110,.06) !important; }
    [class*="singleValue"],[class*="placeholder"] { color: #E8C98A !important; }
    [class*="control"] { background-color: #080A0E !important; border-color: rgba(201,169,110,.12) !important; }

    /* ═══ MEDIA LIBRARY — FULL OPACITY ═══ */
    [class*="MediaLibrary"],[class*="mediaLibrary"],
    [class*="Modal"],[class*="modal"],
    [role="dialog"],[aria-modal="true"] {
      background-color: #0D0F12 !important; opacity: 1 !important;
    }
    [class*="MediaLibrary"] *,[class*="mediaLibrary"] *,
    [role="dialog"] *,[aria-modal="true"] * {
      opacity: 1 !important;
    }
    [class*="DialogOverlay"],[class*="overlay"] { background-color: rgba(0,0,0,.85) !important; }
    [class*="dropzone"],[class*="DropZone"],[class*="Dropzone"],[class*="FileUpload"] {
      background-color: #0A0D12 !important; border: 2px dashed rgba(201,169,110,.2) !important; opacity: 1 !important;
    }
    [role="dialog"] img,[class*="MediaLibrary"] img { opacity: 1 !important; }
    [role="dialog"] input,[class*="MediaLibrary"] input { background-color: #080A0E !important; color: #E8C98A !important; opacity: 1 !important; }

    /* ═══ SCROLLBAR ═══ */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0D0F12; }
    ::-webkit-scrollbar-thumb { background: rgba(201,169,110,.15); border-radius: 3px; }
    svg { fill: currentColor !important; } svg path { fill: inherit !important; }
    img { border-radius: 4px; }

    /* ═══ TOASTS ═══ */
    [class*="oast"],[class*="otification"] { background-color: #151A22 !important; color: #E8C98A !important; }
    [class*="ogin"] { background-color: #0D0F12 !important; }
    [class*="oginButton"] button { background-color: rgba(201,169,110,.08) !important; color: #E8C98A !important; }

    /* ═══ FORMATTING TOOLBAR ═══ */
    .eia-fmt-bar { display: flex; gap: 4px; margin-bottom: 4px; }
    .eia-fmt-bar button { font-size: 12px !important; padding: 3px 8px !important; cursor: pointer !important;
      background: rgba(201,169,110,.06) !important; border: 1px solid rgba(201,169,110,.1) !important;
      color: #C9A96E !important; border-radius: 3px !important; min-width: 28px; }
    .eia-fmt-bar button:hover { background: rgba(201,169,110,.12) !important; border-color: rgba(201,169,110,.2) !important; }



    /* ═══ TOGGLE BUTTON ═══ */
    #cms-theme-toggle {
      position: fixed; bottom: 16px; right: 16px; z-index: 99999;
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(17,22,32,.95) !important;
      border: 1px solid rgba(201,169,110,.15) !important;
      color: #C9A96E !important; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #cms-theme-toggle:hover { border-color: rgba(201,169,110,.4) !important; transform: scale(1.1); }
  </style>
</head>
<body>
  <button id="cms-theme-toggle" title="Theme jour/nuit">☽</button>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  (function(){
    /* ═══ THEME TOGGLE ═══ */
    var btn = document.getElementById('cms-theme-toggle');
    var sheet = document.getElementById('cms-dark-theme');
    var saved = localStorage.getItem('eia-cms-theme') || 'dark';
    function applyTheme(m){
      if(m === 'light'){
        sheet.disabled = true;
        btn.textContent = '☀'; btn.style.background = 'rgba(240,240,240,.9)';
        btn.style.borderColor = 'rgba(0,0,0,.1)'; btn.style.color = '#666';
      } else {
        sheet.disabled = false;
        btn.textContent = '☽'; btn.style.background = 'rgba(17,22,32,.95)';
        btn.style.borderColor = 'rgba(201,169,110,.15)'; btn.style.color = '#C9A96E';
      }
    }
    applyTheme(saved);
    btn.addEventListener('click', function(){
      var next = sheet.disabled ? 'dark' : 'light';
      localStorage.setItem('eia-cms-theme', next);
      applyTheme(next);
    });

    /* ═══ FORMATTING TOOLBAR FOR TEXT WIDGETS ═══ */
    function wrapSelection(ta, before, after){
      var start = ta.selectionStart, end = ta.selectionEnd;
      var sel = ta.value.substring(start, end);
      var newText = ta.value.substring(0, start) + before + sel + after + ta.value.substring(end);
      /* Use native setter to trigger React state update */
      var nativeSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
      nativeSetter.call(ta, newText);
      ta.dispatchEvent(new Event('input', {bubbles: true}));
      ta.selectionStart = start + before.length;
      ta.selectionEnd = end + before.length;
      ta.focus();
    }

    function addToolbar(ta){
      if(ta._fmtDone) return;
      ta._fmtDone = true;
      var bar = document.createElement('div');
      bar.className = 'eia-fmt-bar';

      var buttons = [
        {label: '<b>G</b>', title: 'Gras (**texte**)', fn: function(){ wrapSelection(ta, '**', '**'); }},
        {label: '<i>I</i>', title: 'Italique (*texte*)', fn: function(){ wrapSelection(ta, '*', '*'); }},
        {label: '—', title: 'Séparateur (---)', fn: function(){ wrapSelection(ta, '\n---\n', ''); }},
        {label: '🖼', title: 'Insérer une image', fn: function(){
          /* Try to open Decap CMS media library */
          var mediaBtn = document.querySelector('[class*="MediaLibrary"] button, button[class*="media"], [class*="toolbar"] button[title*="image"], [class*="toolbar"] button[title*="Image"]');
          if(!mediaBtn){
            /* Find any image widget's choose button nearby */
            var allBtns = document.querySelectorAll('button');
            for(var b=0; b<allBtns.length; b++){
              var txt = allBtns[b].textContent.toLowerCase();
              if(txt.indexOf('choose') !== -1 || txt.indexOf('choisir') !== -1 || txt.indexOf('media') !== -1){
                mediaBtn = allBtns[b]; break;
              }
            }
          }
          if(mediaBtn){ mediaBtn.click(); }
          else {
            /* Fallback: insert image path template */
            var path = prompt('Chemin de l\'image (ex: /images/uploads/photo.jpg) :');
            if(path) wrapSelection(ta, '![', ']('+path+')');
          }
        }},
        {label: '❝', title: 'Citation (> texte)', fn: function(){ wrapSelection(ta, '> ', ''); }},
      ];

      buttons.forEach(function(b){
        var bt = document.createElement('button');
        bt.innerHTML = b.label;
        bt.title = b.title;
        bt.type = 'button';
        bt.addEventListener('click', function(e){ e.preventDefault(); b.fn(); });
        bar.appendChild(bt);
      });

      ta.parentNode.insertBefore(bar, ta);
    }

    /* ═══ WORD COUNTER ═══ */
    function addWordCounter(el){
      if(el._wcDone) return;
      el._wcDone = true;
      var parent = el.closest('div[class]') || el.parentNode;
      if(!parent) return;
      var wc = document.createElement('div');
      wc.className = 'eia-wc';
      wc.style.cssText = 'text-align:right;font-size:10px;color:rgba(201,169,110,.35);padding:4px 8px;font-family:monospace';
      parent.appendChild(wc);
      function update(){
        var text = el.textContent || el.value || '';
        var words = text.trim().split(/\s+/).filter(function(w){return w}).length;
        wc.textContent = words + ' mots · ' + text.length + ' car. · ~' + Math.max(1, Math.round(words/200)) + ' min';
      }
      el.addEventListener('input', update);
      el.addEventListener('keyup', update);
      update();
    }

    /* ═══ PUBLICATION NUMBERING ═══ */
    function numberPublications(){
      /* Find all list item summaries and add publication number */
      var summaries = document.querySelectorAll('[class*="ListItemTopBar"] summary, [class*="TopBar"] summary, [class*="StyledListItemTopBar"]');
      if(!summaries.length) return;
      /* Get parent list to count total */
      var parent = summaries[0].closest('[class*="ListControl"], [class*="listControl"], ul, ol');
      if(!parent) return;
      var items = parent.querySelectorAll('[class*="ListItemTopBar"] summary, [class*="TopBar"] summary');
      var total = items.length;
      items.forEach(function(item, i){
        /* Number from bottom (oldest=1, newest=highest) */
        var num = total - i;
        var text = item.textContent || '';
        /* Remove existing numbering */
        text = text.replace(/^#\d+\s*·\s*/, '');
        if(!text.startsWith('#')){
          item.textContent = '#' + num + ' · ' + text;
        }
      });
    }

    /* ═══ MEDIA LIBRARY OPACITY ENFORCER ═══ */
    var observer = new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if(node.nodeType !== 1) return;
          /* Force opacity on modals */
          var isModal = node.getAttribute && (
            node.getAttribute('role') === 'dialog' ||
            node.getAttribute('aria-modal') === 'true' ||
            (node.className && node.className.toString && (
              node.className.toString().indexOf('Modal') !== -1 ||
              node.className.toString().indexOf('modal') !== -1 ||
              node.className.toString().indexOf('MediaLibrary') !== -1
            ))
          );
          if(isModal){
            node.style.setProperty('opacity', '1', 'important');
            node.style.setProperty('background-color', '#0D0F12', 'important');
            node.querySelectorAll('*').forEach(function(el){
              el.style.setProperty('opacity', '1', 'important');
            });
          }
        });
      });

      /* Scan for new textareas and editors */
      document.querySelectorAll('textarea').forEach(function(ta){
        /* Only add toolbar to body/content textareas (rows > 3) */
        if(ta.rows > 3 || ta.offsetHeight > 100) addToolbar(ta);
        addWordCounter(ta);
      });
      document.querySelectorAll('[data-slate-editor="true"]').forEach(addWordCounter);

      /* Number publications */
      numberPublications();

      /* Preview pane dark mode */
      var isDark = !document.getElementById('cms-dark-theme').disabled;
      document.querySelectorAll('[class*="preview" i], [class*="Preview"]').forEach(function(el){
        if(isDark){
          el.style.setProperty('background-color', '#0D0F12', 'important');
          el.style.setProperty('color', 'rgba(201,169,110,.7)', 'important');
        } else {
          el.style.removeProperty('background-color');
          el.style.removeProperty('color');
        }
      });
      /* Fix iframes (Decap renders preview in iframe) */
      document.querySelectorAll('iframe').forEach(function(frame){
        try{
          var fd = frame.contentDocument || frame.contentWindow.document;
          if(!fd || !fd.body) return;
          if(isDark){
            fd.body.style.cssText = 'background:#0D0F12;color:rgba(201,169,110,.7);padding:20px;font-family:Georgia,serif;line-height:1.8';
            if(!fd.getElementById('jit-dark')){
              var s = fd.createElement('style'); s.id = 'jit-dark';
              s.textContent = 'body,p,div,span,li,h1,h2,h3,h4,h5,h6,td,th,dt,dd,label,a,blockquote,figcaption,summary{color:rgba(201,169,110,.7)!important}strong,b{color:#E8C98A!important}em,i{color:rgba(201,169,110,.6)!important}a{color:#C9A96E!important}blockquote{border-left:3px solid rgba(201,169,110,.2)!important;padding-left:16px!important}hr{border-color:rgba(201,169,110,.1)!important}img{opacity:.9;border-radius:4px}';
              fd.head.appendChild(s);
            }
          } else {
            fd.body.style.cssText = 'padding:20px;font-family:Georgia,serif;line-height:1.8';
            var ds = fd.getElementById('jit-dark');
            if(ds) ds.remove();
          }
        }catch(e){}
      });
    });

    observer.observe(document.body, { childList: true, subtree: true });

    /* Initial scan */
    setTimeout(function(){
      document.querySelectorAll('textarea').forEach(function(ta){
        if(ta.rows > 3 || ta.offsetHeight > 100) addToolbar(ta);
        addWordCounter(ta);
      });
      numberPublications();
    }, 3000);
  })();
  </script>
</body>
</html>
