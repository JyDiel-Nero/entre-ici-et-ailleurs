<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0A1624;">

<!-- CONTAINER -->

  <!-- HERO — fused room + clock -->
  <tr><td style="
    background-image:url('https://jydielintime.com/images/email/fond-message-auteur.jpg');
    background-size:cover;background-position:center;
  ">

    <tr><td style="background:linear-gradient(180deg,rgba(10,22,36,0.55) 0%,rgba(10,22,36,0.7) 100%);padding:50px 30px;text-align:center;">

    <p style="margin:0 0 24px;font-size:15px;color:rgba(232,201,138,0.65);line-height:1.8;">
      Cher ami, chère amie,
    </p>

    <!-- Body of the message -->
    <div style="font-size:15px;color:rgba(232,201,138,0.7);line-height:2.1;font-family:Georgia,'Times New Roman',serif;">
      *|MESSAGE|*
    </div>

    <!-- Optional link button — luminous gold border -->
    <!--
      OPTIONNEL : Supprimez ce bloc s'il n'y a pas de lien.
      Remplacez *|LIEN_OPTIONNEL|* et *|TEXTE_BOUTON|*
    -->
    <div style="margin:32px 0;text-align:center;">
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
        <tr><td style="border:1.5px solid #E8C98A;padding:12px 32px;text-align:center;">

            *|TEXTE_BOUTON|*
          </a>
        </td></tr>
      </table>
    </div>

    <!-- Signature — luminous -->
    <div style="margin:24px 0 0;padding:20px 0 0;border-top:1px solid rgba(232,201,138,0.15);">
      <p style="margin:0;font-size:16px;color:#E8C98A;;font-style:italic;font-family:Georgia,'Times New Roman',serif;">
        Avec toute ma reconnaissance,
      </p>
      <p style="margin:8px 0 0;font-size:14px;color:#F0D99A;">
        &#8212; Daniel, J.Y.D.
      </p>
      <p style="margin:4px 0 0;font-size:11px;color:#A8884E;font-style:italic;font-family:Georgia,'Times New Roman',serif;"><em>
        Entre ici et ailleurs
      </p>
    </div>

  </td></tr>

  <!-- FOOTER — fused image background again -->
  <tr><td style="
    background-image:url('https://jydielintime.com/images/email/fond-message-auteur.jpg');
    background-size:cover;background-position:center bottom;
